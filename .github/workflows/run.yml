- name: Run Script
  env:
    TG_API_ID: ${{ secrets.TG_API_ID }}
    TG_API_HASH: ${{ secrets.TG_API_HASH }}
    TG_SESSION: ${{ secrets.TG_SESSION }}
    GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    # 👇 أضف هذين السطرين هنا 👇
    FB_TOKEN_IRAQ: ${{ secrets.FB_TOKEN_IRAQ }}
    PAGE_ID_IRAQ: ${{ secrets.PAGE_ID_IRAQ }}
  run: python main.py
