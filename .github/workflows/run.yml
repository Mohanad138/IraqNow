name: Telegram to Facebook Relay

on:
  # جدولة داخلية من جيت هاب (احتياطية)
  schedule:
    - cron: '*/15 * * * *'
    
  # للسماح بالتشغيل اليدوي من زر Run workflow
  workflow_dispatch:
  
  # 👇 هذا هو السطر الأهم الذي يربط cron-job.org بالسكريبت
  repository_dispatch:
    types: [run-iraq]

permissions:
  contents: write

jobs:
  run-relay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "relay-user"
          git config --global user.email "relay-user@example.com"

      - name: Run Script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_TOKEN_IRAQ: ${{ secrets.FB_TOKEN_IRAQ }}
          PAGE_ID_IRAQ: ${{ secrets.PAGE_ID_IRAQ }}
        run: python main.py
